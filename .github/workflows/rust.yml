name: Build and Test EPANET-RS

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features --no-deps -- -D warnings
      - name: Check Python bindings formatting
        run: cargo fmt --manifest-path python/Cargo.toml --all -- --check
      - name: Run clippy on Python bindings
        run: cargo clippy --manifest-path python/Cargo.toml --locked --all-targets --no-deps -- -D warnings
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: cargo build  --locked --verbose
      - name: Run tests
        run: cargo test --locked --verbose
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv python install 3.12
      - name: Create virtual environment
        working-directory: python
        run: uv venv --python 3.12
      - name: Install maturin and test dependencies
        working-directory: python
        run: uv pip install maturin pytest
      - name: Build and install the extension module
        working-directory: python
        run: uv run maturin develop --release --locked
      - name: Run Python tests
        working-directory: python
        run: uv run pytest -v
